name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22 regression
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare canonical Windows workspace
        shell: pwsh
        run: |
          $workspaceRoot = 'C:\dev-intelligence-hub-ci-root'
          $projectRoot = Join-Path $workspaceRoot 'repo'
          $temporaryRoot = 'C:\dev-intelligence-hub-temp'
          $localAppDataRoot = 'C:\dev-intelligence-hub-localappdata'
          $currentUser = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          foreach ($root in @($workspaceRoot, $temporaryRoot, $localAppDataRoot)) {
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            & icacls.exe $root /inheritance:r /grant:r "${currentUser}:(OI)(CI)F" "SYSTEM:(OI)(CI)F"
            if ($LASTEXITCODE -ne 0) { throw "Unable to secure $root" }
          }
          git clone --no-hardlinks "$env:GITHUB_WORKSPACE" $projectRoot
          git -C $projectRoot fetch "$env:GITHUB_WORKSPACE" $env:GITHUB_SHA
          git -C $projectRoot checkout --detach FETCH_HEAD
          $actualHead = git -C $projectRoot rev-parse HEAD
          if ($actualHead -ne $env:GITHUB_SHA) {
            throw "Canonical checkout is $actualHead instead of $env:GITHUB_SHA"
          }
          if (-not (Test-Path (Join-Path $projectRoot 'npm-shrinkwrap.json') -PathType Leaf)) {
            throw 'Canonical checkout is missing npm-shrinkwrap.json'
          }
          "CI_PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$temporaryRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temporaryRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$localAppDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install structured CLI
        run: npm install --global @openai/codex

      - name: Install dependencies
        working-directory: ${{ env.CI_PROJECT_ROOT }}
        run: npm ci

      - name: Run committed regression suite
        working-directory: ${{ env.CI_PROJECT_ROOT }}
        shell: pwsh
        run: |
          node --test --test-concurrency=2 --test-reporter=tap test/00-u9-priority.mjs "test/*.test.js" "test/*.test.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 --test-reporter=tap test/open-source-distribution.mjs
